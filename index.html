<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08060B">
<title>传门的世界 · THE CHUANMEN SHOW</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#08060B;color:#fff;overflow:hidden}
body{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.6vh;
  padding:6vw;text-align:center;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:radial-gradient(120% 90% at 50% 0%,#2B1232 0%,#0C050F 58%,#040306 100%);
}
.kicker{font-size:max(10px,2.2vw);letter-spacing:.42em;color:#FF6FA5}
h1{margin:0;font-size:max(22px,6.4vw);letter-spacing:.06em;font-weight:900;
   background:linear-gradient(100deg,#fff 20%,#FFA3C4 55%,#FF2D6F 100%);
   -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0;font-size:max(11px,3.2vw);line-height:1.9;color:rgba(255,255,255,.5)}
.bar{position:relative;width:min(74vw,520px);height:4px;border-radius:4px;overflow:hidden;
     background:rgba(255,255,255,.12)}
.bar i{position:absolute;inset:0;width:0%;border-radius:4px;
       background:linear-gradient(90deg,#FF2D6F,#FFA3C4);transition:width .25s ease}
.pct{font-family:ui-monospace,Consolas,monospace;font-size:max(11px,2.9vw);color:#FFA3C4;letter-spacing:.1em}
.tip{position:fixed;left:0;right:0;bottom:3.2vh;font-size:max(10px,2.6vw);
     color:rgba(255,255,255,.3);letter-spacing:.08em}
.tip a{color:rgba(255,255,255,.5);text-decoration:underline}
</style></head>
<body>
  <p class="kicker">THE CHUANMEN SHOW</p>
  <h1>传门的世界</h1>
  <p class="sub" id="sub">正在载入课件…<br>首次约 4.7 MB，之后会走缓存秒开</p>
  <div class="bar"><i id="bar"></i></div>
  <p class="pct" id="pct">0%</p>
  <p class="tip">等不及？<a href="deck.html">直接打开课件</a></p>
<script>
(function(){
  var bar=document.getElementById('bar'), pct=document.getElementById('pct'), sub=document.getElementById('sub');
  function show(p){
    var v=Math.max(1,Math.min(100,Math.round(p)));
    bar.style.width=v+'%'; pct.textContent=v+'%';
  }
  function done(text){
    try{
      document.open(); document.write(text); document.close();
    }catch(e){
      location.replace('deck.html');
    }
  }
  fetch('deck.html', {cache:'force-cache'}).then(function(r){
    if(!r.ok) throw new Error(r.status);
    if(!r.body || !r.body.getReader || !window.TextDecoder){ return r.text(); }
    var total=+(r.headers.get('Content-Length')||0);
    var reader=r.body.getReader(), dec=new TextDecoder('utf-8');
    var chunks=[], got=0;
    return (function pump(){
      return reader.read().then(function(res){
        if(res.done){ return chunks.join(''); }
        chunks.push(dec.decode(res.value,{stream:true})); got+=res.value.length;
        if(total) show(got/total*100); else show(Math.min(95, got/110000));
        return pump();
      });
    })();
  }).then(function(text){
    show(100);
    setTimeout(function(){ done(text); }, 80);
  }).catch(function(){
    sub.textContent='载入失败，正在直接打开课件…';
    setTimeout(function(){ location.replace('deck.html'); }, 600);
  });
})();
</script>
</body></html>
